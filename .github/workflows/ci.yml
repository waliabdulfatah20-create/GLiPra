name: CI

# Runs the full local gate on every PR and on pushes to master.
# Linux runner: the Windows/OneDrive Hermes bundler issues are local-only and
# do not affect lint / type-check / tests in CI.
#
# Gate scope (mirrors `pnpm check-all` + vitest):
#   - eslint (fails on errors; 220 warnings are non-blocking by design)
#   - tsc --noemit (type-check)
#   - i18n translation parity + message-syntax (lint:translations)
#   - jest component/integration suite
#   - vitest pure-logic suite (test:utils)

on:
  pull_request:
  push:
    branches: [master]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate (lint + type-check + translations + jest)
        run: pnpm check-all

      - name: Unit tests (vitest)
        run: pnpm test:utils
